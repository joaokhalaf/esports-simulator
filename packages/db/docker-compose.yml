name: esports-simulator

services:
  postgres:
    image: postgres:18
    container_name: esports-simulator-postgres
    environment:
      POSTGRES_DB: esports-simulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - esports-simulator_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U postgres -d esports-simulator",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  esports-simulator_postgres_data:
