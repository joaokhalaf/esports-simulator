name: CD

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy web to Cloudflare
    needs: validate
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'homologation' }}
    concurrency:
      group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'homologation' }}
      cancel-in-progress: false
    env:
      CI: "true"
      NODE_ENV: production
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      DEPLOY_STAGE: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'homologation' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Production requires a vMAJOR.MINOR.PATCH tag." >&2
              exit 1
            }
            git merge-base --is-ancestor HEAD origin/master || {
              echo "Release commit must belong to master." >&2
              exit 1
            }
          fi
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in VITE_SERVER_URL CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "Missing environment configuration: $key" >&2
              exit 1
            fi
          done
          node -e 'const u = new URL(process.env.VITE_SERVER_URL); if (u.protocol !== "https:") throw new Error("VITE_SERVER_URL must use HTTPS")'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: pnpm install --frozen-lockfile
      - name: Deploy the validated revision
        working-directory: packages/infra
        run: pnpm exec alchemy deploy --stage "$DEPLOY_STAGE" --yes
